[project]
name = "grpo-trl"
version = "0.1.0"
description = "Is GRPO a better policy optimiser than PPO for Think-Reason-Learn's VerifiableRL? A pre-registered study."
requires-python = ">=3.13"
dependencies = [
    "think-reason-learn[rl] @ git+https://github.com/Vela-Research/think-reason-learn@a71264508d609bbbb15f40b0154bfcaead01aa81",
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.3",
    "pyarrow>=17",
    "scikit-learn>=1.7",
    "matplotlib>=3.9",
    "sentence-transformers>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["grpo_trl"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
